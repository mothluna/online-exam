spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 独立测试库：createDatabaseIfNotExist 需要 root 权限；不污染开发库 oes
    url: jdbc:mysql://localhost:3306/oes_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    hikari:
      maximum-pool-size: 8
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123456
      # 独立 DB，避免测试令牌影响本地开发会话
      database: 15
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

app:
  seed:
    enabled: true

logging:
  level:
    root: warn
    com.example.oes: info
