name: oes

services:
  mysql:
    image: mysql:8.0.36
    container_name: oes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: oes
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=300
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7.2-alpine
    container_name: oes-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis123456}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${OBJECT_STORAGE_IMAGE:-rustfs/rustfs:latest}
    container_name: oes-minio
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_PASSWORD:-minio123456}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # ---------- 应用层：默认不启动，生产/演示用 --profile app 拉起 ----------
  # 开发时只起中间件：docker compose up -d
  # 全量部署：docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build:
      context: ../backend
    container_name: oes-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: oes
      MYSQL_PASSWORD: oes123456
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123456}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minio123456}
      MINIO_BUCKET: oes-file
      # 生产部署务必通过 .env 覆盖，HS256 要求至少 32 字节
      JWT_SECRET: ${JWT_SECRET:-oes-dev-secret-key-please-change-in-production-0123456789}
    ports:
      - "8080:8080"

  web:
    profiles: ["app"]
    build:
      context: ../frontend
    container_name: oes-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # 80 端口常被占用，这里用 8081；如需 80 直接改左侧端口
      - "8081:80"

volumes:
  mysql-data:
  redis-data:
  minio-data:
